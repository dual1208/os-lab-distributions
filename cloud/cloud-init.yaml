#cloud-config
package_update: true
package_upgrade: false

users:
  - default
  - name: builder
    gecos: OpenWrt build user
    shell: /bin/bash
    lock_passwd: true
  - name: campus-link-a
    gecos: campus-link site-a edge
    system: true
    primary_group: campus-link-a
    groups: []
    homedir: /nonexistent
    no_create_home: true
    shell: /usr/sbin/nologin
    lock_passwd: true
  - name: campus-link-b
    gecos: campus-link site-b edge
    system: true
    primary_group: campus-link-b
    groups: []
    homedir: /nonexistent
    no_create_home: true
    shell: /usr/sbin/nologin
    lock_passwd: true

packages:
  - build-essential
  - clang
  - flex
  - bison
  - g++
  - gawk
  - gcc-multilib
  - gettext
  - git
  - libelf-dev
  - libncurses-dev
  - libssl-dev
  - python3
  - python3-setuptools
  - qemu-system-x86
  - qemu-utils
  - rsync
  - subversion
  - swig
  - unzip
  - upx-ucl
  - zlib1g-dev
  - file
  - wget
  - curl
  - jq
  - zstd
  - ca-certificates
  - nftables
  - iproute2
  - dnsmasq-base
  - socat
  - ufw

write_files:
  - path: /etc/sysctl.d/90-openwrt-lab.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
  - path: /etc/systemd/system/openwrt-lab-bootstrap.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Prepare persistent OpenWrt lab workspace
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/install -d -o builder -g builder -m 0755 /srv/openwrt-lab /srv/openwrt-lab/build /srv/openwrt-lab/artifacts

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [sysctl, --system]
  - [usermod, -aG, kvm, builder]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, default, deny, routed]
  - [ufw, allow, OpenSSH]
  - [ufw, --force, enable]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, openwrt-lab-bootstrap.service]
  - [bash, -lc, 'git clone --depth=1 https://github.com/dual1208/os-lab-distributions.git /srv/openwrt-lab/repo && chown -R builder:builder /srv/openwrt-lab/repo']

final_message: "OpenWrt lab host bootstrap finished"
